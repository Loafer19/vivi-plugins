# Native helper programs of downloadable plugins (plugins/discord, plugins/remote-control).
# A separate crate: nothing here is linked into Vivi.
# Built per platform by .github/workflows/plugins.yml.
[package]
name = "vivi-helpers"
version = "1.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
