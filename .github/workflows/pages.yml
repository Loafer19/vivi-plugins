name: Pages
# Publishes the marketplace (scripts/build-marketplace.py) to GitHub Pages as a mirror of
# https://plugins.viviplayer.app. https://loafer19.github.io/vivi-plugins/index.json is a
# fallback catalog URL; the primary site is deployed by Dokploy from deploy/plugins/Dockerfile.
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/build-marketplace.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
