[[changelog]]
version = "1.3.1"
date = "2026-11-06"
notes = "Player menu: \"Undo SponsorBlock skip\" only after a skip or mute (or while Vivi's Skip button has the segments). The menu conditions take effect from the next Vivi release (after 0.15); Vivi 0.15 and older show the entries as before."

[[changelog]]
version = "1.3.0"
date = "2026-10-19"
notes = "Vivi 0.13+: segments go to the player's one Skip button (Skip Intro & Credits): \"Skip sponsor\", Undo after automatic skips, \"Unmute\" in muted segments, Alt+K / Alt+Shift+K, and no second button where a chapter-named intro is the same segment. The per-category modes and the mute setting still decide; Vivi's per-category setting can override them. Older Vivi, or Skip Intro & Credits off: skips, asks and mutes itself as before."

[[changelog]]
version = "1.2.0"
date = "2026-10-19"
notes = "Per-category skip / ask / off (\"intro=ask outro=skip filler=off\"). Segments marked for muting are muted instead of skipped (Alt+Shift+K unmutes), shown as \"(muted)\" chapters. README: undo is Alt+Shift+K with no time limit; new screenshots."

[[changelog]]
version = "1.1.0"
date = "2026-10-15"
notes = "Skip notice with undo (Alt+Shift+K), works for files downloaded by the YouTube plugin (\"[video id]\" in the name)."

[[changelog]]
version = "1.0.1"
date = "2026-10-15"
notes = "Requires Vivi 0.9.0 (managed ffmpeg support)."

