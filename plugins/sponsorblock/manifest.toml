id = "sponsorblock"
name = "SponsorBlock"
version = "1.3.0"
description = "Skips sponsor, intro, self-promotion and other segments in YouTube videos using the crowd-sourced SponsorBlock database: segments as chapters on the seek bar, skip / ask / off per category, and muting where a segment is marked for muting. In Vivi 0.13+ the segments appear on the player's one Skip button (Skip sponsor, Undo, Alt+K / Alt+Shift+K). Also works for videos the YouTube plugin adds or downloads."
author = "Vivi"
kind = "mpv-lua"
entry = "sponsorblock.lua"
min_vivi = "0.9.0"
icon = "skip"
lucide = "badge-dollar-sign"
permissions = ["network", "subprocess"]
issue = 73
default_enabled = true

[[settings]]
key = "categories"
title = "Categories (space separated: sponsor selfpromo interaction intro outro preview music_offtopic filler)"
type = "text"
default = "sponsor selfpromo interaction"

[[settings]]
key = "mode"
title = "When a segment starts (Vivi 0.13+: what the Skip button does)"
type = "choice"
options = ["Skip automatically", "Ask (Alt+K skips)"]
default = "Skip automatically"

[[settings]]
key = "per_category"
title = "Per category, overrides the above (e.g. \"intro=ask outro=skip filler=off\")"
type = "text"
default = ""

[[settings]]
key = "mute"
title = "Mute segments that are marked for muting instead of skipping"
type = "toggle"
default = "true"

[[settings]]
key = "chapters"
title = "Mark segments as chapters"
type = "toggle"
default = "true"

[[settings]]
key = "api"
title = "API server"
type = "text"
default = "https://sponsor.ajay.app"

[[settings]]
key = "notice"
title = "Show a notice with undo (Alt+Shift+K) after each skip (older Vivi; Vivi 0.13+ shows Undo on its Skip button)"
type = "toggle"
default = "true"

[[settings]]
key = "local"
title = "Also for downloaded files named \"… [video id].ext\""
type = "toggle"
default = "true"

[[settings]]
key = "undo"
title = "Undo the last skip or unmute (Alt+Shift+K)"
type = "action"
label = "Undo"
