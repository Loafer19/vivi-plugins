[[changelog]]
version = "1.1.0"
date = "2026-10-19"
notes = "Statistics in Vivi's own plugin dialog (Alt+S, the new Home widget, the side-drawer tab and the palette): Today / 7 / 30 / 365-day chips, grouped by artist or show, title or day with bars, a filter field, totals and a day streak; older Vivi keeps an OSD panel, now below the title bar (it covered the first line), and the toast is one line instead of the whole chart. Record statistics switch to pause counting. Pauses and buffering are timed exactly (up to 5 s were lost or added per pause). Summary covers applies live. Clear asks first. README: requires Vivi 0.9.0 (not 0.8.0); new screenshots."

