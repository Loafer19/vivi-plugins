id = "scene-chapters"
name = "Scene Chapters"
version = "1.1.0"
description = "Creates chapters at scene changes for local videos without chapters (ffmpeg scene detection in the background, merged with SponsorBlock chapters). Chapter pictures come from Chapter Thumbnails. Results are cached per file."
author = "Vivi"
kind = "mpv-lua"
entry = "scene-chapters.lua"
min_vivi = "0.9.0"
icon = "chapters"
lucide = "clapperboard"
permissions = ["filesystem", "subprocess"]
size_note = "uses ffmpeg"
issue = 62
default_enabled = true

[[settings]]
key = "auto"
title = "Detect scenes automatically for videos without chapters"
type = "toggle"
default = "false"

[[settings]]
key = "scan"
title = "Scan (Keyframes only: about 10× faster, finds fewer cuts)"
type = "choice"
options = ["Every frame", "Keyframes only"]
default = "Every frame"

[[settings]]
key = "threshold"
title = "Scene change threshold (0.1–0.9, lower = more chapters)"
type = "text"
default = "0.4"

[[settings]]
key = "min_gap"
title = "Minimum chapter length (seconds)"
type = "text"
default = "30"

[[settings]]
key = "detect"
title = "Detect scenes now (Alt+J; again to cancel)"
type = "action"
label = "Detect"

[[settings]]
key = "clear"
title = "Remove the scene chapters and forget this file's scan"
type = "action"
label = "Forget"
