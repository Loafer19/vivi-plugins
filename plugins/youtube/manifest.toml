id = "youtube"
name = "YouTube & yt-dlp"
version = "1.3.0"
description = "Search YouTube in Vivi's own dialog or paste a video, playlist or channel URL (Alt+U with one in the clipboard) to play, queue or list it, see the estimated size of each quality, and download video or audio only into a folder you choose, with progress in Vivi's Downloads panel. Needs Vivi 0.13 or newer. Uses your system yt-dlp and ffmpeg when present; otherwise downloads and updates verified copies: yt-dlp (18–40 MB) from its official releases on first use, Vivi's own minimal static ffmpeg + ffprobe (about 6 MB) only for 1080p+ or audio conversion."
author = "Vivi"
kind = "mpv-lua"
entry = "youtube.lua"
min_vivi = "0.13.0"
icon = "youtube"
lucide = "youtube"
permissions = ["network", "filesystem", "subprocess"]
default_enabled = true
size_note = "+ yt-dlp, ffmpeg if needed"
role = "source"

[[contributes]]
point = "sidebar.source"
label = "YouTube"
command = "open"

[[contributes]]
point = "palette.command"
label = "Search YouTube"
command = "open"

[[contributes]]
point = "palette.command"
label = "YouTube: list the playlist URL"
command = "add"

[[contributes]]
point = "palette.command"
label = "YouTube: download the playing video"
command = "download-current"

[[contributes]]
point = "context.player"
label = "Download this video"
command = "download-current"

[[contributes]]
point = "downloads"
label = "YouTube downloads"
command = ""

[[settings]]
key = "open"
title = "Search YouTube or list a link in Vivi's dialog"
type = "action"
label = "Search…"

[[settings]]
key = "url"
title = "Video or playlist URL (Alt+U pastes from the clipboard)"
type = "text"
default = ""

[[settings]]
key = "add"
title = "List the entries in the playlist"
type = "action"
label = "Add to playlist"

[[settings]]
key = "quality"
title = "Download quality"
type = "choice"
options = ["Best available", "2160p", "1440p", "1080p", "720p", "480p", "360p"]
default = "1080p"

[[settings]]
key = "mode"
title = "Download"
type = "choice"
options = ["Video", "Audio only"]
default = "Video"

[[settings]]
key = "audio-format"
title = "Audio-only format (mp3/m4a/opus use ffmpeg, downloaded if missing)"
type = "choice"
options = ["Original", "mp3", "m4a", "opus"]
default = "Original"

[[settings]]
key = "sizes"
title = "Estimated size per quality"
type = "action"
label = "Show sizes"

[[settings]]
key = "folder"
title = "Download folder (empty: Downloads/Vivi)"
type = "text"
default = ""

[[settings]]
key = "pick-folder"
title = "Choose the download folder"
type = "action"
label = "Choose…"

[[settings]]
key = "download"
title = "Download the URL above (a playlist URL downloads the playlist; empty: the playing video)"
type = "action"
label = "Download"

[[settings]]
key = "download-current"
title = "Download the playing video (only that video, even from a playlist)"
type = "action"
label = "Download"

[[settings]]
key = "cancel"
title = "Stop the running download and the queued ones"
type = "action"
label = "Cancel"

[[settings]]
key = "view"
title = "Search results"
type = "choice"
options = ["List", "Grid"]
default = "List"

[[settings]]
key = "source"
title = "yt-dlp to use"
type = "choice"
options = ["Auto (system if recent, else managed)", "System", "Managed copy"]
default = "Auto (system if recent, else managed)"

[[settings]]
key = "auto-update"
title = "Update the managed yt-dlp daily (and ffmpeg monthly)"
type = "toggle"
default = "true"

[[settings]]
key = "update"
title = "Update the managed yt-dlp now"
type = "action"
label = "Update"

[[settings]]
key = "update-ffmpeg"
title = "Update the managed ffmpeg (downloaded only for 1080p+ or audio conversion)"
type = "action"
label = "Update"

[[settings]]
key = "info"
title = "Which yt-dlp and ffmpeg are used"
type = "action"
label = "Show"
