id = "youtube-music"
name = "YouTube Music"
version = "1.1.0"
description = "Your own YouTube Music account in Vivi: search songs, albums, artists and playlists, your liked songs, playlists, saved albums and history, up next and mixes, likes and adding to playlists, with Premium audio when your account has it. Signs in with your browser's cookies (kept in a private file, wiped on Sign out). Optional downloads with tags and cover, also of whole playlists, albums and liked songs as Vivi playlists you can sync, off by default. Unofficial: uses YouTube Music's web API, not a Google-approved app; it may break when Google changes it, and Google may restrict accounts that use it. Needs yt-dlp (the YouTube & yt-dlp plugin provides one), curl and a Vivi with the plugin music dialog: 0.13, or a 0.12.0 build from master of 18 Oct 2026 or later."
author = "Vivi"
kind = "mpv-lua"
entry = "youtube-music.lua"
min_vivi = "0.12.0"
icon = "youtube-music"
lucide = "music"
permissions = ["network", "filesystem", "subprocess"]
default_enabled = false
size_note = "+ yt-dlp"
role = "source"

[[contributes]]
point = "sidebar.source"
label = "YouTube Music"
command = "open"

[[contributes]]
point = "streams.music"     # Vivi's Streams hub → Music (#86); older Vivi ignores it
label = "YouTube Music"
command = "open"

[[contributes]]
point = "palette.command"
label = "Search YouTube Music"
command = "open"

[[contributes]]
point = "palette.command"
label = "YouTube Music: liked songs"
command = "liked"

[[contributes]]
point = "palette.command"
label = "YouTube Music: sync downloaded playlists"
command = "sync-playlists"

[[contributes]]
point = "context.player"
label = "Start radio from this song"
command = "radio-current"

[[contributes]]
point = "context.player"
label = "Download this song"
command = "download-current"

[[contributes]]
point = "context.player"
label = "Like this song on YouTube Music"
command = "like-current"

[[contributes]]
point = "tray.item"
label = "YouTube Music: like this song"
command = "like-current"

[[contributes]]
point = "tray.item"
label = "YouTube Music: start radio from this song"
command = "radio-current"

[[contributes]]
point = "notify"
label = "Download finished or failed"
command = ""

[[settings]]
key = "open"
title = "Search and your library in Vivi's music dialog"
type = "action"
label = "Open YouTube Music"

[[settings]]
key = "browser"
title = "Browser you are signed in with at music.youtube.com"
type = "choice"
options = ["Firefox", "Chrome", "Chromium", "Brave", "Edge", "Opera", "Vivaldi", "Safari", "Whale"]
default = "Firefox"

[[settings]]
key = "sign-in"
title = "Copy that browser's youtube.com cookies with yt-dlp (Chrome-based browsers may ask for the keyring password)"
type = "action"
label = "Sign in"

[[settings]]
key = "cookie-file"
title = "Or a cookies.txt / copied request headers file of a music.youtube.com request"
type = "text"
default = ""

[[settings]]
key = "import"
title = "Import the cookie file above"
type = "action"
label = "Import"

[[settings]]
key = "paste"
title = "Or paste a Cookie header, request headers or \"Copy as cURL\" from the clipboard"
type = "action"
label = "Paste"

[[settings]]
key = "sign-out"
title = "Delete the stored cookies (your browser stays signed in)"
type = "action"
label = "Sign out"

[[settings]]
key = "up-next"
title = "Up next after a song played from search"
type = "toggle"
default = "true"

[[settings]]
key = "audio-only"
title = "Audio only (turn off to watch music videos)"
type = "toggle"
default = "true"

[[settings]]
key = "view"
title = "Results view"
type = "choice"
options = ["List", "Grid"]
default = "List"

[[settings]]
key = "downloads"
title = "Allow downloads (off by default; may violate YouTube's Terms of Service, personal use only, at your own risk; needs yt-dlp)"
type = "toggle"
default = "false"

[[settings]]
key = "folder"
title = "Download folder (empty: ~/Music/vivi)"
type = "text"
default = ""

[[settings]]
key = "audio-format"
title = "Download format (mp3/m4a/opus convert with ffmpeg)"
type = "choice"
options = ["Original (m4a/opus, no re-encode)", "m4a", "mp3", "opus"]
default = "Original (m4a/opus, no re-encode)"

[[settings]]
key = "cancel"
title = "Stop the running download and empty the queue"
type = "action"
label = "Cancel downloads"
