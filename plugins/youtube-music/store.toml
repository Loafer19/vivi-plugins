[[changelog]]
version = "1.1.0"
date = "2026-10-25"
notes = "YouTube Music now also appears in Vivi's Streams hub, under Music next to Free Music (Vivi with the Streams hub, after 0.13.1), as well as in the sidebar. Older Vivi versions ignore the new entry and work as before."

[[changelog]]
version = "1.0.1"
date = "2026-10-20"
notes = "Fix: Cancel did not stop a running download (yt-dlp kept going until the song was saved), and closing Vivi during a download had to wait until Vivi force-stopped yt-dlp."

[[changelog]]
version = "1.0.0"
date = "2026-10-19"
notes = "First release: sign in with your browser's cookies (browser, cookies.txt / headers file or clipboard), search, liked songs, playlists, albums and history, album / playlist / artist pages, up next and mixes, likes and adding to playlists, now-playing card, opt-in downloads with tags and cover, and Download playlist / Sync for playlists, albums and liked songs (a Vivi playlist in YouTube Music's order). Needs a Vivi with the plugin music dialog (0.13, or a 0.12.0 master build of 18 Oct 2026 or later); on the 0.12.0 release Open explains that instead of doing nothing."
