[[changelog]]
version = "1.3.0"
date = "2026-10-26"
notes = "The phone page's sleep timer is now Vivi's own (Vivi 0.14+): the same timer as the side panel, the top-bar moon and AI agents, with Vivi's volume fade-out, so setting it on the phone shows in Vivi and the other way round; a timer set in Vivi to the end of the chapter or after N items shows on the phone too. Older Vivi keeps the helper's own timer."

[[changelog]]
version = "1.2.0"
date = "2026-10-20"
notes = "New: sleep timer on the phone page (15–90 minutes or the end of the current file; Vivi pauses with a toast, the page counts down), Play next for library results and Open URL, and repeat (off / queue / this file) and shuffle buttons on Vivi versions whose own buttons follow them (after 0.12.0; hidden on older ones). Show QR code no longer also shows the address and PIN as a toast on Vivi 0.11.0+ (it has the QR dialog). Fixes: a phone that was connected when the PIN changed (New PIN) kept polling with the old PIN, cleared the PIN being typed every second and locked itself out for a minute; the Library tab never found Vivi's control socket without XDG_RUNTIME_DIR (macOS), as it looked in ~/.cache instead of ~/.cache/vivi; the helper retries the port for a few seconds after a restart instead of failing with \"address in use\"; the docs said the QR dialog and fullscreen need Vivi 0.10.1, it is 0.11.0; the Library hint names the actual setting (Allow AI agents and scripts). Security: the PIN reaches the helper on stdin instead of its command line (readable by every local user) on Linux and macOS; the PIN setting is masked; embedded covers are extracted into a fresh owner-only folder instead of a predictable /tmp file; the failed-PIN table is pruned."

[[changelog]]
version = "1.1.0"
date = "2026-10-16"
notes = "Redesigned phone page in Vivi's style (dark, orange accent, Inter, Lucide icons, big touch targets; phone portrait/landscape and tablet layouts). New: live updates, mute, speed, audio/subtitle track picker, chapters, queue remove, library search (with Settings → General → Remote control → Allow AI agents and scripts), fullscreen, open URL, add to home screen (web app manifest and icon). Pair by QR code (Show QR code; the QR dialog and fullscreen need Vivi 0.11.0+, older versions show a toast), New PIN action, Local network only setting; the PIN is no longer put in URLs and DNS-rebinding requests are refused. Fixes: quotes around the address in the toast, a stale cover after switching files, cover art for files that were still loading, queue names without file extensions, sizes in the catalog include the helper."

[[changelog]]
version = "1.0.0"
date = "2026-10-15"
notes = "First release as a downloadable plugin with a native helper (moved out of the core)."
