[[changelog]]
version = "1.1.0"
date = "2026-10-16"
notes = "Redesigned phone page in Vivi's style (dark, orange accent, Inter, Lucide icons, big touch targets; phone portrait/landscape and tablet layouts). New: live updates, mute, speed, audio/subtitle track picker, chapters, queue remove, library search (with Settings → General → Remote control), fullscreen, open URL, add to home screen (web app manifest and icon). Pair by QR code (Show QR code; the QR dialog and fullscreen need Vivi 0.10.1+, older versions show a toast), New PIN action, Local network only setting; the PIN is no longer put in URLs and DNS-rebinding requests are refused. Fixes: quotes around the address in the toast, a stale cover after switching files, cover art for files that were still loading, queue names without file extensions, sizes in the catalog include the helper."

