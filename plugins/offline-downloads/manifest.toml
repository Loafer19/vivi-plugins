id = "offline-downloads"
name = "Offline Downloads"
version = "1.1.3"
description = "A download queue for offline listening and watching: YouTube and other yt-dlp sites, direct music files (Jamendo, Internet Archive and any audio/video link) and radio streams recorded for a set time. Pending / active / paused / done / failed list with pause, cancel and retry, progress and a download folder. Paste a URL or press Alt+D with one in the clipboard. Downloads no tools of its own: it uses curl and your yt-dlp, or the copy the YouTube & yt-dlp plugin manages."
author = "Vivi"
kind = "mpv-lua"
entry = "offline-downloads.lua"
min_vivi = "0.9.1"
icon = "download"
lucide = "download"
permissions = ["network", "filesystem", "subprocess"]
size_note = "uses yt-dlp if present"
default_enabled = true
role = "feature"

# Where it shows up in Vivi 0.13+ (older Vivi ignores these). The queue is reported to
# the shared Downloads panel (Library → Downloads); this plugin also provides the
# panel's "paste a link" field and its "Download the playing stream" button.
[[contributes]]
point = "downloads"
label = "Download queue (yt-dlp sites, music files, radio recordings)"
command = ""

[[contributes]]
point = "downloads.url"
label = "Paste a link: YouTube or other yt-dlp site, music file, radio stream"
command = "enqueue"

[[contributes]]
point = "downloads.action"
label = "Record stream"
command = "record"

[[contributes]]
point = "downloads.action"
label = "Add URL from clipboard"
command = "add-clipboard"

[[contributes]]
point = "palette.command"
label = "Downloads: record the playing stream"
command = "record"

[[contributes]]
point = "palette.command"
label = "Downloads: add the URL in the clipboard"
command = "add-clipboard"

[[contributes]]
point = "palette.command"
label = "Downloads: add the playing stream"
command = "add-current"

[[contributes]]
point = "palette.command"
label = "Downloads: show the queue"
command = "show"

[[contributes]]
point = "context.player"
label = "Download for offline"
command = "add-current"

[[contributes]]
point = "tray.item"
label = "Show downloads"
command = "show"

[[contributes]]
point = "notify"
label = "Download finished or failed"
command = ""

[[settings]]
key = "url"
title = "URL to download (Alt+D adds the one in the clipboard)"
type = "text"
default = ""

[[settings]]
key = "add"
title = "Add the URL to the queue"
type = "action"
label = "Add"

[[settings]]
key = "add-current"
title = "Add the playing online item"
type = "action"
label = "Add current"

[[settings]]
key = "record"
title = "Record the playing radio / live stream for the set length"
type = "action"
label = "Record"

[[settings]]
key = "show"
title = "Show the queue (Alt+Shift+D)"
type = "action"
label = "Show"

[[settings]]
key = "pause"
title = "Pause the active download / resume paused ones"
type = "action"
label = "Pause / Resume"

[[settings]]
key = "cancel"
title = "Cancel the active download (or remove waiting ones)"
type = "action"
label = "Cancel"

[[settings]]
key = "retry"
title = "Retry failed downloads"
type = "action"
label = "Retry"

[[settings]]
key = "clear-done"
title = "Remove finished downloads from the list (files are kept)"
type = "action"
label = "Clear"

[[settings]]
key = "folder"
title = "Download folder (empty: Downloads/Vivi)"
type = "text"
default = ""

[[settings]]
key = "pick-folder"
title = "Choose the download folder"
type = "action"
label = "Choose…"

[[settings]]
key = "open-folder"
title = "Open the download folder"
type = "action"
label = "Open"

[[settings]]
key = "video-quality"
title = "yt-dlp quality (merging video + audio needs ffmpeg; without it single files are used)"
type = "choice"
options = ["Best single file", "Best", "1080p", "720p", "480p", "Audio only"]
default = "Best single file"

[[settings]]
key = "radio-minutes"
title = "Radio / live stream recording length (minutes)"
type = "choice"
options = ["30", "10", "60", "120", "240"]
default = "30"

[[settings]]
key = "info"
title = "Which yt-dlp and ffmpeg are used"
type = "action"
label = "Show"
