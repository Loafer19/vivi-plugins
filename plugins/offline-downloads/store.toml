# Marketplace listing (plugins.viviplayer.app). Not part of the package zip,
# so editing it needs no new plugin version.
categories = ["Music", "Streaming", "Tools"]
tags = ["download", "offline", "queue", "yt-dlp", "radio", "jamendo", "archive.org"]
screenshots = ["offline-downloads-panel"]

[[changelog]]
version = "1.1.5"
date = "2026-10-30"
notes = "Discard in Vivi's Downloads panel (Vivi 0.16+): the trash button on a running download or recording stops it and deletes what it wrote, also a recording, which Cancel keeps. The row then reads Discarded, without a failure notification, and Retry starts it again. Older Vivi ignores it."

[[changelog]]
version = "1.1.4"
date = "2026-10-30"
notes = "Radio stations no longer download forever (#2): streams are detected with a short GET (many Icecast servers refuse the HEAD request used before), from ICY headers, an audio type without a size, or mpv showing that the playing item is live, and recorded as radio. Every recording stops after the set length, also when yt-dlp records it. The Downloads panel shows Recording m:ss of N min; Cancel (or the new Stop) ends it gracefully and keeps a playable file listed as done with its length (Recorded 12:30); Discard deletes it instead. Quitting Vivi keeps a recording too."

[[changelog]]
version = "1.1.3"
date = "2026-10-20"
notes = "Downloads stop when Vivi quits (tray menu Quit, closing the window, Ctrl+Q): each curl / yt-dlp / ffmpeg runs under a small watchdog that stops it, and what it started, once Vivi is gone, so no download keeps running in the background with no Vivi to show or cancel it. A stopped download resumes from the queue next time."

[[changelog]]
version = "1.1.2"
date = "2026-10-19"
notes = "Download for offline works for YouTube and YouTube Music items that have no single file with video and audio any more (\"Requested format is not available\"): every quality falls back to merging or audio only, YouTube Music links download the best audio. Downloads show in Vivi's Downloads panel again (the panel check read Vivi's flag wrongly). Own download icon in Vivi 0.13+. README: copyright / Terms of Service note, keys and settings, a Downloads panel screenshot."

[[changelog]]
version = "1.1.1"
date = "2026-10-18"
notes = "Record stream: a Downloads panel button, a palette command and a setting record the playing radio / live stream (or the copied URL) for the set length, even when the server reports a file size. Add URL from clipboard in the panel and the palette."

[[changelog]]
version = "1.1.0"
date = "2026-10-18"
notes = "Vivi 0.13+: the queue shows in the shared Downloads panel (Library → Downloads) with per-download Pause / Resume, Cancel and Retry; the panel's paste-a-link field and its Download / record button add to this queue; Show and Alt+Shift+D open the panel. Older Vivi keeps the on-screen queue."

[[changelog]]
version = "1.0.0"
date = "2026-10-15"
notes = "First release: queue with pause / cancel / retry for yt-dlp sites, direct files and radio recordings."
