# Marketplace listing (plugins.viviplayer.app). Not part of the package zip,
# so editing it needs no new plugin version.
categories = ["Music", "Tools"]
tags = ["acoustid", "musicbrainz", "chromaprint", "tagging", "rename"]
screenshots = ["acoustid-settings"]

[[changelog]]
version = "1.1.1"
date = "2026-10-20"
notes = "Deprecated: Vivi 0.13.0's built-in Auto-tagger does what this plugin did (Chromaprint fingerprint, AcoustID + MusicBrainz lookup, identifying untagged songs as they start, per-file answer cache) without an API key of your own. The script is otherwise unchanged and keeps working on older Vivi."

[[changelog]]
version = "1.1.0"
date = "2026-10-20"
notes = "The API key is kept in a private file on Vivi 0.13+ (no longer in mpv's log; existing keys move over by themselves). New: identify untagged songs as they start and show the match as now playing; answers are cached per file, so each file is looked up once. Messages are Vivi toasts instead of mpv's OSD; palette entry; fixes for relative file paths and the missing pkgdir option warning."

[[changelog]]
version = "1.0.0"
date = "2026-10-15"
notes = "First release: fpcalc fingerprint (system or downloaded), AcoustID + MusicBrainz lookup into the Auto-tagger review, file name proposal from a pattern."
