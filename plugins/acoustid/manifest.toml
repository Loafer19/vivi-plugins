id = "acoustid"
name = "AcoustID Tagger"
version = "1.1.0"
description = "Identifies the playing song by its sound: fingerprints it with Chromaprint's fpcalc, looks it up on AcoustID and MusicBrainz and opens the Auto-tagger's before/after review with the tags and a new file name built from your pattern (for example {artist} - {title}), applied only when you confirm. Optionally identifies untagged songs as they start and shows the match as now playing (card, MPRIS, Scrobbler) without changing the file. Uses an installed fpcalc, otherwise downloads the official one (1.3–2.6 MB). Needs your free AcoustID application key, kept in a private file on Vivi 0.13+."
author = "Vivi"
kind = "mpv-lua"
entry = "acoustid.lua"
min_vivi = "0.10.0"
icon = "tag"
lucide = "fingerprint"
permissions = ["network", "filesystem", "subprocess"]
size_note = "+ fpcalc if needed"
issue = 76
default_enabled = true
# Vivi 0.13+: the API key comes from plugin-data/acoustid/vivi-secrets.json (0600), not
# from mpv script-opts, which mpv writes to its log with their values.
secrets_file = true

[[contributes]]
point = "context.player"
label = "Identify with AcoustID"
command = "identify"

[[contributes]]
point = "palette.command"
label = "Identify the playing song (AcoustID)"
command = "identify"

[[settings]]
key = "api-key"
title = "AcoustID application API key (free: acoustid.org/new-application)"
type = "secret"
default = ""

[[settings]]
key = "pattern"
title = "New file name: {artist} {title} {album} {albumartist} {year} {track} {genre}"
type = "text"
default = "{artist} - {title}"

[[settings]]
key = "auto"
title = "Identify untagged songs when they start and show the match as now playing (Vivi 0.13+; the file is not changed)"
type = "toggle"
default = "false"

[[settings]]
key = "download"
title = "Download fpcalc when it is not installed"
type = "toggle"
default = "true"

[[settings]]
key = "identify"
title = "Identify the playing file (Alt+I)"
type = "action"
label = "Identify"

[[settings]]
key = "detect"
title = "Which fpcalc is used"
type = "action"
label = "Show"

[[settings]]
key = "forget"
title = "Forget cached AcoustID results (each file is looked up once)"
type = "action"
label = "Clear"
