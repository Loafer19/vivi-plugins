id = "subtitle-sync"
name = "Subtitle Auto-Sync"
version = "1.3.0"
description = "Aligns the current external subtitle to the audio, or in seconds to another subtitle track (Alt+Shift+Y), with alass or ffsubsync in the background, then loads the synced copy saved next to the original and picks it again the next time the file opens. From Vivi 0.13 the manual offset (Z / X, Alt+Z / Alt+X, side panel) belongs to the player; on older Vivi this plugin's Alt+Z / Alt+X keys keep it per file. Uses an installed alass or ffsubsync; otherwise downloads alass on first use (3 MB on Linux x86_64, 26 MB on Windows) and, to read the audio without a system ffmpeg, Vivi's media ffmpeg build (about 15 MB, shared with Chapter Thumbnails)."
author = "Vivi"
kind = "mpv-lua"
entry = "subtitle-sync.lua"
min_vivi = "0.9.0"
icon = "subtitles"
lucide = "captions"
permissions = ["network", "filesystem", "subprocess"]
size_note = "+ alass, ffmpeg if needed"
issue = 72
default_enabled = true

# Vivi newer than 0.12.0 reads these; older versions use the same first two built in.
[[contributes]]
point = "menu.subtitles"
label = "Auto-sync subtitles"
command = "sync"

[[contributes]]
point = "palette.command"
label = "Auto-sync subtitles"
command = "sync"

[[contributes]]
point = "menu.subtitles"
label = "Sync subtitles to another track"
command = "sync-ref"

[[contributes]]
point = "palette.command"
label = "Sync subtitles to another subtitle track"
command = "sync-ref"

[[settings]]
key = "tool"
title = "Sync tool"
type = "choice"
options = ["Auto", "alass", "ffsubsync"]
default = "Auto"

[[settings]]
key = "download"
title = "Download alass when no sync tool is installed"
type = "toggle"
default = "true"

[[settings]]
key = "step"
title = "Offset step for Alt+Z / Alt+X in seconds (Alt+Shift: 10 steps; Vivi before 0.13)"
type = "choice"
options = ["0.1", "0.05", "0.25", "0.5"]
default = "0.1"

[[settings]]
key = "prefer"
title = "Use the synced copy when a file opens with the original subtitle"
type = "toggle"
default = "true"

[[settings]]
key = "sync"
title = "Sync current subtitle to the audio (Alt+Y)"
type = "action"

[[settings]]
key = "sync-ref"
title = "Sync current subtitle to another subtitle track (Alt+Shift+Y)"
type = "action"
label = "Sync"

[[settings]]
key = "reset"
title = "Reset the subtitle offset of this file (Alt+Backspace)"
type = "action"
label = "Reset"

[[settings]]
key = "detect"
title = "Which sync tool and ffmpeg are used"
type = "action"
label = "Show"
