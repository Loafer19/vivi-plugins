[[changelog]]
version = "1.3.0"
date = "2026-10-20"
notes = "Sync to another subtitle track (Alt+Shift+Y): the secondary subtitle or another text track of the file, in seconds instead of minutes. The synced copy is picked again when the file opens with the original selected. The toast says how far the subtitle moved; a manual offset left over from the original is reset. Re-syncing starts from the original file, a re-sync replaces the loaded copy instead of adding another track, and the copy keeps the original's name and language. ffsubsync works with Vivi's ffmpeg build too. Messages show once, as Vivi toasts. On Vivi 0.13+, which keeps the per-file offset itself, the plugin binds no offset keys and keeps no offsets.json; offsets saved here earlier are imported by Vivi once."

[[changelog]]
version = "1.2.0"
date = "2026-10-16"
notes = "Works with Vivi's per-file subtitle offset (Vivi 0.11+): Alt+Z / Alt+X go to Vivi, offsets saved by older versions are handed over once, and the side panel's Auto-sync button runs this plugin."

[[changelog]]
version = "1.1.1"
