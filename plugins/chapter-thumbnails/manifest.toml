id = "chapter-thumbnails"
name = "Chapters & Previews"
version = "1.2.0"
description = "Thumbnail preview while hovering the seek bar and a picture for every chapter in the Chapters tab, generated in the background and cached per file. Optional scene chapters for videos without chapters (ffmpeg scene detection, Alt+J; merged with SponsorBlock chapters). Alt+H lists the chapters. Uses your ffmpeg; without one it downloads Vivi's media ffmpeg build once (about 15 MB, shared with Subtitle Auto-Sync)."
author = "Vivi"
kind = "mpv-lua"
entry = "chapter-thumbnails.lua"
min_vivi = "0.9.2"
icon = "chapters"
lucide = "gallery-horizontal-end"
permissions = ["network", "filesystem", "subprocess"]
size_note = "+ ffmpeg if needed"
issue = 75
default_enabled = true
role = "feature"

# Where it shows up in Vivi 0.13+ (older Vivi ignores these and uses its built-in default,
# the "Generate chapter thumbnails" palette command; Alt+J still detects scenes there).
[[contributes]]
point = "palette.command"
label = "Generate chapter thumbnails"
command = "generate"

[[contributes]]
point = "menu.video"
label = "Detect scene chapters"
command = "scenes-detect"

[[contributes]]
point = "palette.command"
label = "Detect scene chapters"
command = "scenes-detect"

[[contributes]]
point = "palette.command"
label = "Forget scene chapters"
command = "scenes-forget"

[[settings]]
key = "seekbar"
title = "Seek-bar hover thumbnails"
type = "toggle"
default = "true"

[[settings]]
key = "chapters"
title = "Chapter thumbnails (Chapters tab)"
type = "toggle"
default = "true"

[[settings]]
key = "when"
title = "Generate seek-bar thumbnails"
type = "choice"
options = ["On hover", "On open"]
default = "On hover"

[[settings]]
key = "frames"
title = "Seek-bar thumbnails per file (Auto: one per 10 s)"
type = "choice"
options = ["Auto", "25", "50", "100", "200"]
default = "Auto"

[[settings]]
key = "download"
title = "Download ffmpeg when none is installed"
type = "toggle"
default = "true"

[[settings]]
key = "max-cache"
title = "Files kept in the thumbnail cache"
type = "choice"
options = ["200", "50", "1000"]
default = "200"

[[settings]]
key = "max-cache-mb"
title = "Thumbnail cache size limit (MB)"
type = "choice"
options = ["500", "100", "2000"]
default = "500"

[[settings]]
key = "scenes"
title = "Scene chapters: detect scenes automatically in videos without chapters"
type = "toggle"
default = "false"

[[settings]]
key = "scenes-scan"
title = "Scene scan (Keyframes only: about 10× faster, finds fewer cuts)"
type = "choice"
options = ["Every frame", "Keyframes only"]
default = "Every frame"

[[settings]]
key = "scenes-threshold"
title = "Scene change threshold (0.1–0.9, lower = more chapters)"
type = "text"
default = "0.4"

[[settings]]
key = "scenes-min-length"
title = "Minimum scene chapter length (seconds)"
type = "text"
default = "30"

[[settings]]
key = "scenes-detect"
title = "Detect scene chapters now (Alt+J; again to cancel)"
type = "action"
label = "Detect"

[[settings]]
key = "scenes-forget"
title = "Remove the scene chapters and forget this file's scan"
type = "action"
label = "Forget"

[[settings]]
key = "generate"
title = "Generate the thumbnails of this file now"
type = "action"
label = "Generate"

[[settings]]
key = "list"
title = "Chapter list (Alt+H)"
type = "action"
label = "Show"

[[settings]]
key = "clear"
title = "Delete the cached thumbnails of this file"
type = "action"
label = "Clear"

[[settings]]
key = "clear-all"
title = "Delete the whole thumbnail cache"
type = "action"
label = "Clear all"
