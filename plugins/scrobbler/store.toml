[[changelog]]
version = "1.2.0"
date = "2026-10-20"
notes = "Love the playing track (Alt+L) on Last.fm and ListenBrainz; skip podcasts, audiobooks (.m4b) and chosen folders; repeat one counts every play; Connect Last.fm finishes by itself once you allow access, plus Disconnect; Status checks the ListenBrainz token and says why a file is not scrobbled; streams described by music packages (YouTube Music) are scrobbled; album artist, track number and MusicBrainz release / artist ids are sent. Privacy: the Last.fm session key moves out of Vivi's config into a private 0600 file, tokens no longer appear on curl's command line or in mpv's log, queue files are 0600, and the ListenBrainz token is only sent over https. Fixes: a wrong Last.fm secret or API key no longer deletes the offline queue, one rejected listen no longer drops a whole batch, messages are Vivi toasts instead of mpv's hidden OSD, the Last.fm session survives restarts on Vivi 0.9.0, MD5 works on Lua 5.1 builds without the bit library, and the needless filesystem permission is gone. On Vivi 0.13+: track data comes from Vivi's shared now-playing track (tags, library and music-package metadata merged; no own copy of vivi-media-meta), secret settings come from a private file instead of mpv's script-opts (which mpv logs), and live radio is not scrobbled."

