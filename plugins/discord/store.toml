# Marketplace listing (plugins.viviplayer.app). Not part of the package zip,
# so editing it needs no new plugin version.
categories = ["Integrations", "Music"]
tags = ["discord", "rich-presence", "status", "privacy", "youtube"]
screenshots = ["discord-settings", "discord-status"]

[[changelog]]
version = "1.2.0"
date = "2026-10-20"
notes = "Works right after install: Discord status now goes through Vivi's own Discord application (“Listening to Vivi”) with the Vivi logo as the picture, no setup needed. The application ID setting is now an optional Custom Discord application ID (empty = Vivi's); an ID you already entered keeps working with your own app and your Large image setting. A custom ID that is not a number falls back to Vivi's application with a warning instead of showing nothing."

[[changelog]]
version = "1.1.0"
date = "2026-10-20"
notes = "Privacy: video titles are hidden by default (new Hide video titles, on: videos show only “Watching a video”, music keeps its titles); stream URLs are never shown as the title (a stream without tags shows its file name or host, never tokens or query strings), file names lose their extension, nothing is shown for finished files or still images; new Show for: Music only. New: YouTube thumbnail as the picture for YouTube streams, an optional link button for public sites (YouTube, SoundCloud, Bandcamp, Vimeo, Twitch, Internet Archive), the title or artist instead of the app name in the member list, the album as the picture's tooltip, an https image URL as the large image. Fixes: the timer follows the playback speed (no resend every few seconds at 1.5×), at most 5 updates per 20 s (Discord drops the rest), no padded empty status line, a hanging Discord no longer blocks the helper, Connection status is a clean Vivi toast (no JSON quotes) in plain words (“Discord did not answer”) and no longer shows a stale state after a settings change; two settings changed in a row can no longer leave two helpers running (an old one, e.g. still showing titles after Hide titles was turned on); while a stream opens the previous status stays instead of flashing the host name. On Vivi 0.13+ titles, artist, album and cover come from Vivi's shared now-playing track (tags, library, radio titles and music-package metadata merged); a music package's stream counts as music. README rewritten with what is sent to Discord."

[[changelog]]
version = "1.0.0"
date = "2026-10-15"
notes = "First release as a downloadable plugin with the native vivi-discord helper (moved out of the core)."
