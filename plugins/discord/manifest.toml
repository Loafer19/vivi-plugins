id = "discord"
name = "Discord Rich Presence"
version = "1.2.0"
description = "Shows what you play in your Discord status: title, artist, progress, YouTube thumbnails, optional link button; privacy options to hide names or videos. Works right after install through Vivi's own Discord application (a custom application ID is optional); the Discord desktop app must be running on this computer. Ships a small native helper (vivi-discord) that talks to Discord's local IPC."
author = "Vivi"
kind = "mpv-lua"
entry = "discord.lua"
min_vivi = "0.9.1"
icon = "discord"
lucide = "gamepad-2"
permissions = ["subprocess"]
issue = 57
default_enabled = false
binaries = ["vivi-discord"]

[[settings]]
key = "app-id"
title = "Custom Discord application ID (optional; empty = Vivi's own)"
type = "text"
default = ""

[[settings]]
key = "show"
title = "Show for"
type = "choice"
options = ["Music and videos", "Music only"]
default = "Music and videos"

[[settings]]
key = "hide-names"
title = "Hide titles and file names (only \"Listening to music\" / \"Watching a video\")"
type = "toggle"
default = "false"

[[settings]]
key = "hide-video-titles"
title = "Hide video titles (videos show only \"Watching a video\"; music keeps its titles)"
type = "toggle"
default = "true"

[[settings]]
key = "status-name"
title = "Name in the member list (\"Listening to …\")"
type = "choice"
options = ["Application name", "Title", "Artist"]
default = "Application name"

[[settings]]
key = "cover-art"
title = "YouTube thumbnail as the picture for YouTube streams"
type = "toggle"
default = "true"

[[settings]]
key = "link-button"
title = "Link button for public streams (YouTube, SoundCloud, Bandcamp, Vimeo, Twitch, Internet Archive)"
type = "toggle"
default = "false"

[[settings]]
key = "image"
title = "Large image: an https URL or an art asset key of your Discord app (empty = Vivi logo)"
type = "text"
default = ""

[[settings]]
key = "status"
title = "Connection status"
type = "action"
label = "Show"
